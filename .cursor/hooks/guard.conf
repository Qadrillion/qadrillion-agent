# guard.conf — per-workspace fences, sourced by the guard scripts.
# Shell/path patterns use POSIX extended regexes (grep -E); MCP patterns use
# Python regular expressions against normalized tool names. Read-file extras are
# globs. Empty patterns disable that match, but unknown MCP effects still ask.
# Commit this policy with the workspace; it is defense in depth, not a sandbox.

# Paths the agent must never touch from this workspace (another client's
# workspace, a personal folder, a production checkout). Matched against the
# full shell command AND against file-read paths.
PROTECTED_PATHS=''
# example: PROTECTED_PATHS='/Documents/OtherClient(/|$)|/Documents/Personal(/|$)'

# Anything that looks like a test runner or a mutation script. A command that
# matches TEST_RUNNERS *and* PROD_SELECTORS is denied — tests never run
# against production from an agent.
TEST_RUNNERS='(pytest|newman|playwright|locust|k6|maestro|cypress|jest|vitest|mobile-run|dotnet\s+test|gradle\S*\s+test|xcodebuild\s+test|\./scripts/verify|verify_[a-z_]+\.py)'
PROD_SELECTORS='(^|[^a-zA-Z])(prod|production)([^a-zA-Z]|$)'
# example, add your real hosts so a bare URL is caught too:
# PROD_SELECTORS='(^|[^a-zA-Z])(prod|production)([^a-zA-Z]|$)|api\.example\.com'

# Extra deny / ask patterns for shell commands (regex, matched on the command).
EXTRA_DENY=''
EXTRA_ASK='--confirm-write|push-collection'

# MCP fences. Server regexes match server names; tool regexes match only tool
# names, normalized from camelCase to snake_case. Unknown effects ask by default.
# Servers the agent must never call from this workspace (e.g. the cloud
# variant of a tracker plugin when the project uses the on-prem server).
MCP_DENY_SERVERS=''
# Tool names that are never allowed regardless of server.
MCP_DENY_TOOLS='delete|remove|destroy|purge|drop'
# Tool names that require the user's confirmation (the confirm-gate, enforced).
# Verbs are matched against the TOOL name only. Prefer the full write verb
# (transition_issue, add_label) over a stem that also appears in read tools
# (get_transitions, get_labels).
MCP_ASK_TOOLS='create|update|add_comment|comment|transition_issue|assign|post|send|publish|patch|put|schedule|trigger|deploy|merge|resolve|upload|write|edit|add_label|set_|exec|execute|evaluate|run|request|http|api|invoke|call|sql|graphql'
# Explicit read-name allowlist, evaluated only after deny/ask rules. Customize
# to verified tool semantics; a read-looking name is not proof of read-only
# behavior. Empty means every otherwise unknown tool asks. Query tools that
# execute code/SQL/HTTP belong in MCP_ASK_TOOLS, even if named as reads.
MCP_READ_TOOLS='(^|[^a-z0-9])(get|list|search|fetch|query|describe|read|find|lookup|inspect|count)([^a-z0-9]|$)'

# Extra file patterns the agent may never read into context (shell globs,
# space-separated). The env/key/credential family is denied unconditionally.
EXTRA_DENY_READ='*accounts_pool.json */.sessions/* *.keychain-db'
